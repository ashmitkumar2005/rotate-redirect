<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Redirect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .card {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px;
    padding: 48px 40px; max-width: 480px; width: 90%; text-align: center;
  }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 24px;
    border: 3px solid #2a2a2a; border-top-color: #e0e0e0; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: #888; line-height: 1.6; }
  .countdown { margin-top: 20px; font-size: 13px; color: #555; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1>Redirecting...</h1>
  <p>You are being redirected to a random video from the playlist.</p>
  <p>This link changes every 13&ndash;20 minutes.</p>
  <div class="countdown" id="countdown"></div>
</div>

<script>

const BASE = "https://vipshort.in/";

function getRandomInterval() {
  return 13 + Math.floor(Math.random() * 8);
}

function pickRandom() {
  return CODES[Math.floor(Math.random() * CODES.length)];
}

function getState() {
  const raw = localStorage.getItem("rotate_state");
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return null;
}

function setState(code, nextAt) {
  localStorage.setItem("rotate_state", JSON.stringify({ code, nextAt }));
}

function currentCode() {
  const state = getState();
  const now = Date.now();
  if (state && state.nextAt && now < state.nextAt) {
    return state.code;
  }
  const newCode = pickRandom();
  const interval = getRandomInterval();
  setState(newCode, now + interval * 60 * 1000);
  return newCode;
}

function redirect() {
  const code = currentCode();
  const url = BASE + code;
  const countdown = document.getElementById("countdown");
  const state = getState();
  if (state && state.nextAt) {
    const rem = Math.max(0, Math.floor((state.nextAt - Date.now()) / 1000));
    const min = Math.floor(rem / 60);
    const sec = rem % 60;
    countdown.textContent = "Next rotation in " + min + "m " + sec + "s";
  }
  window.location.replace(url);
}

redirect();
</script>
</body>
</html>
